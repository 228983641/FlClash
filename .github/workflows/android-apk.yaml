name: Android APK

# The main build job only runs for upstream tags, so branch builds never
# produce an APK. This workflow builds a debug-signed APK for this branch
# instead, using the same steps as the upstream Android build minus the
# release signing setup (without a release keystore the build falls back
# to the debug key with the .dev application id suffix).
# The debug key is pinned: runners are ephemeral, so a freshly generated
# debug keystore would change the signature on every run and break
# update installs. The ANDROID_DEBUG_KEYSTORE_BASE64 repository secret
# holds a fixed debug keystore (conventional android/androiddebugkey
# credentials) that is restored to ~/.android/debug.keystore before the
# build; when the secret is unset the build falls back to a fresh key.
on:
  push:
    branches:
      - smart-anchor
      - smart-anchor-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore stable debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          elif [ "$GITHUB_REF" = refs/heads/smart-anchor-v2 ]; then
            echo 'Stable Android test signing key is required' >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Analyze and test smart routing
        if: github.ref == 'refs/heads/smart-anchor-v2'
        shell: bash
        run: |
          flutter analyze --no-fatal-infos
          cp pubspec.yaml "$RUNNER_TEMP/smart-anchor-pubspec.yaml"
          trap 'cp "$RUNNER_TEMP/smart-anchor-pubspec.yaml" pubspec.yaml' EXIT
          sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
          flutter test test/smart_anchor test/providers/proxies_action_test.dart test/providers/smart_anchor_lock_test.dart test/views/smart_anchor_edit_test.dart test/l10n test/lint/dynamic_message_key_test.dart

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: dart setup.dart android --arch arm64 -v

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mapfile -d '' apks < <(find dist -type f -name '*.apk' -print0)
          test "${#apks[@]}" -gt 0
          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/build-verification.txt
          for apk in "${apks[@]}"; do
            "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee -a dist/build-verification.txt
            "$build_tools/aapt" dump badging "$apk" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' | tee -a dist/build-verification.txt
            sha256sum "$apk" | tee -a dist/build-verification.txt
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-${{ github.sha }}
          path: ./dist
          if-no-files-found: error
          overwrite: true
